<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Offline</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent: #333333;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .wrapper {
            text-align: center;
            padding: 2rem;
            animation: subtleFadeIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        #donut {
            font-family: 'Courier New', Courier, monospace;
            font-size: 8px;
            line-height: 8px;
            text-align: left;
            color: var(--text-secondary);
            margin: 0 auto 2rem auto;
            white-space: pre;
            display: inline-block;
        }

        h1 {
            font-size: clamp(24px, 4vw, 40px);
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
        }

        p {
            font-size: clamp(14px, 2vw, 16px);
            font-weight: 300;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
            margin: 0 auto;
        }

        @keyframes subtleFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <pre id="donut"></pre>
        <h1>Under Maintenance</h1>
        <p>The system is currently undergoing scheduled updates. Access will be restored shortly.</p>
    </div>
    
    <script>
        (function() {
            var preTag = document.getElementById('donut');
            var A = 1;
            var B = 1;

            // Render function for ASCII donut
            function renderAsciiFrame() {
                var b = [];
                var z = [];
                A += 0.07;
                B += 0.03;
                var cA = Math.cos(A), sA = Math.sin(A),
                    cB = Math.cos(B), sB = Math.sin(B);

                for(var k = 0; k < 1760; k++) {
                    b[k] = k % 80 === 79 ? "\n" : " ";
                    z[k] = 0;
                }

                for(var j = 0; j < 6.28; j += 0.07) {
                    var ct = Math.cos(j), st = Math.sin(j);
                    for(var i = 0; i < 6.28; i += 0.02) {
                        var sp = Math.sin(i), cp = Math.cos(i),
                            h = ct + 2, 
                            D = 1 / (sp * h * sA + st * cA + 5),
                            t = sp * h * cA - st * sA;

                        var x = 0 | (40 + 30 * D * (cp * h * cB - t * sB)),
                            y = 0 | (12 + 15 * D * (cp * h * sB + t * cB)),
                            o = x + 80 * y,
                            N = 0 | (8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB));
                        
                        if(y < 22 && y >= 0 && x >= 0 && x < 79 && D > z[o]) {
                            z[o] = D;
                            b[o] = ".,-~:;=!*#$@"[N > 0 ? N : 0];
                        }
                    }
                }
                preTag.innerHTML = b.join("");
            }

            // Run the animation
            setInterval(renderAsciiFrame, 50);
        })();
    </script>
</body>
</html>
