<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:             #d5cfbe;
            --bg-card:        rgba(190,185,170,0.45);
            --text:           #000000;
            --text-3:         #666666;
            --border-2:       rgba(0,0,0,0.12);
            --font-display:   'Playfair Display', Georgia, 'Times New Roman', serif;
            --font-body:      'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono:      'DM Mono', 'Courier New', monospace;
            --radius-pill:    100px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 600px;
            animation: fadeIn 0.8s ease-out forwards;
        }

        .label {
            display: inline-block;
            font-family: var(--font-body);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text);
            background: var(--bg-card);
            border: 1px solid var(--border-2);
            padding: 5px 14px;
            border-radius: var(--radius-pill);
            margin-bottom: 28px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(36px, 5vw, 64px);
            font-weight: 400;
            font-style: italic;
            line-height: 1.1;
            letter-spacing: -0.015em;
            margin-bottom: 24px;
        }

        p {
            font-size: 16px;
            line-height: 1.65;
            color: var(--text-3);
            font-weight: 400;
            margin-bottom: 32px;
        }
        
        .contact {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-3);
            letter-spacing: 0.05em;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="label">System Status</div>
        <h1>Under Maintenance</h1>
        <p>The site is currently undergoing scheduled maintenance or being rebuilt. <br>Please check back shortly.</p>
        <div class="contact">
            — Thank you for your patience —
        </div>
    </div>
</body>
</html>
